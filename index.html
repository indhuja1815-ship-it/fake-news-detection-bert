<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake News Detection Using BERT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5fb;
      color: #172554;
    }

    header {
      background: #142b52;
      color: white;
      padding: 22px 7%;
      font-size: 21px;
      font-weight: bold;
    }

    main {
      max-width: 850px;
      margin: 55px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0000000c;
    }

    .tag {
      color: #2563eb;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      line-height: 1.7;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
      margin-top: 12px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eff6ff;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>TruthLens | AI News Analyzer</header>

  <main>
    <section class="card">
      <div class="tag">MACHINE LEARNING PROJECT</div>

      <h1>Fake News Detection</h1>

      <p>
        Enter a news headline or article to analyze it
        using our BERT-based fake news detection model.
      </p>

      <label for="news">
        <strong>Enter news text</strong>
      </label>

      <textarea id="news"
        placeholder="Paste your news article or headline here..."></textarea>

      <button onclick="checkNews()">Analyze News</button>

      <div id="result" role="status"></div>
    </section>
  </main>

  <footer>
    Fake News Detection Using BERT Algorithm
    <br>
    Machine Learning Techniques Project
  </footer>

  <script>
    function checkNews() {
      const news = document.getElementById("news").value.trim();
      const result = document.getElementById("result");

      result.style.display = "block";

      if (!news) {
        result.textContent = "Please enter some news text first.";
        return;
      }

      result.textContent =
        "Your website is working! The BERT model will be connected next.";
    }
  </script>
</body>
</html>
